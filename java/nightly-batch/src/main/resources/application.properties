# stdout must carry nothing but the program's own DISPLAY output (byte-exact diff)
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=OFF

# The datasource URL is supplied at launch from --workdir (see NightlyBatchApplication):
# a file-based H2 database inside the job sandbox, so the Spring Batch JobRepository
# and the KSDS tables survive between the JVM runs of a restart.
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

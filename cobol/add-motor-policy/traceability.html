;", "import org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration;", "import org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration;", "import org.springframework.context.annotation.Bean;", "", "import java.nio.file.Path;", "", "/**", " * Entry point for the add-motor-policy batch translation of COBOL ADDMPOL.", " *", " * <p>Module zero deliberately does NOT bind to a database — golden-master", " * replay compares flat-file outputs to the COBOL run. JPA entities exist for", " * methodology completeness; persistence will be wired in module 1.", " */", "@SpringBootApplication(exclude = {", "        DataSourceAutoConfiguration.class,", "        HibernateJpaAutoConfiguration.class", "})", "public class AddMotorPolicyApplication {", "", "    public static void main(String[] args) {", "        SpringApplication.run(AddMotorPolicyApplication.class, args);", "    }", "", "    @Bean", "    CommandLineRunner runBatch(BatchRunner runner) {", "        return args -> {", "            // Args: [requests-file] [output-dir]   (defaults to CWD)", "            Path requests = args.length >= 1 ? Path.of(args[0]) : Path.of(\"requests.dat\");", "            Path outDir   = args.length >= 2 ? Path.of(args[1]) : Path.of(\".\");", "            int exit = runner.run(requests, outDir);", "            // Match COBOL: 0 on normal completion (even with rejected records)", "            System.exit(exit);", "        };", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/addmotorpolicy/batch/BatchRunner.java", "lines": ["package com.example.poc.addmotorpolicy.batch;", "", "import com.example.poc.addmotorpolicy.domain.MotorEntity;", "import com.example.poc.addmotorpolicy.domain.MotorPolicyRequest;", "import com.example.poc.addmotorpolicy.domain.PolicyEntity;", "import com.example.poc.addmotorpolicy.service.MotorPremiumCalculator;", "import com.example.poc.addmotorpolicy.service.PremiumOverflowException;", "import com.example.poc.addmotorpolicy.service.RequestValidator;", "import com.example.poc.addmotorpolicy.service.RequestValidator.ValidationFailure;", "import org.springframework.stereotype.Component;", "", "import java.io.BufferedReader;", "import java.io.BufferedWriter;", "import java.io.IOException;", "import java.math.BigDecimal;", "import java.nio.charset.StandardCharsets;", "import java.nio.file.Files;", "import java.nio.file.Path;", "import java.nio.file.StandardOpenOption;", "import java.util.Optional;", "", "/**", " * Mirror of MAIN-LOGIC + HANDLE-ONE-REQUEST in ADDMPOL.cbl:158-198.", " *", " * <p>Reads {@code requests.dat}, calls validator + calculator, writes", " * {@code policy.dat}, {@code motor.dat}, {@code error.log} in the byte-exact", " * COBOL format and prints OK/ERR/SUMMARY lines to stdout.", " *", " * <p>Files are opened with TRUNCATE — matching {@code OPEN OUTPUT}.", " */", "// COBOL: ADDMPOL.cbl:158-198 (MAIN-LOGIC + HANDLE-ONE-REQUEST)", "@Component", "public class BatchRunner {", "", "    private final RecordCodec codec;", "    private final RequestValidator validator;", "    private final MotorPremiumCalculator calculator;", "", "    public BatchRunner(RecordCodec codec,", "                       RequestValidator validator,", "                       MotorPremiumCalculator calculator) {", "        this.codec = codec;", "        this.validator = validator;", "        this.calculator = calculator;", "    }", "", "    public int run(Path requestsFile, Path outDir) {", "        Path policyOut = outDir.resolve(\"policy.dat\");", "        Path motorOut  = outDir.resolve(\"motor.dat\");", "        Path errorOut  = outDir.resolve(\"error.log\");", "", "        try {", "            Files.createDirectories(outDir);", "        } catch (IOException e) {", "            System.err.println(\"FATAL: cannot create output dir \" + outDir + \": \" + e);", "            return 90;", "        }", "", "        try (BufferedReader in = Files.newBufferedReader(requestsFile, StandardCharsets.US_ASCII      System.out.println(String.format(", "                    \"SUMMARY processed=%06d inserted=%06d rejected=%06d\",", "                    processed, inserted, rejected));", "            return 0;", "", "        } catch (IOException e) {", "            System.err.println(\"FATAL: cannot open input: \" + e);", "            return 90;", "        }", "    }", "", "    // ---- formatters (must be byte-exact; see spec §6.1) ----", "", "    static String formatOk(BigDecimal customer, BigDecimal policy, BigDecimal premium) {", "        // \"OK  CUST=NNNNNNNNNN POL=NNNNNNNNNN PREM=NNNNNN\"   (two spaces after OK)", "        return \"OK  CUST=\" + RecordCodec.num(customer, 10)", "             + \" POL=\" + RecordCodec.num(policy, 10)", "             + \" PREM=\" + RecordCodec.num(premium, 6);", "    }", "", "    static String formatErr(BigDecimal customer, int rc, String reason) {", "        // \"ERR CUST=NNNNNNNNNN RC=NN <reason padded with spaces to 106 chars>\"", "        return \"ERR CUST=\" + RecordCodec.num(customer, 10)", "             + \" RC=\" + String.format(\"%02d\", rc)", "             + \" \" + RecordCodec.padRight(reason, 106);", "    }", "", "    static void writeErr(BufferedWriter errW, BigDecimal customer, int rc, String reason) throws IOException {", "        // error.log is LINE SEQUENTIAL: trailing spaces stripped on WRITE.", "        String line = RecordCodec.num(customer, 10) + \" \"", "                    + String.format(\"%02d\", rc) + \" \"", "                    + reason;", "        errW.write(line.stripTrailing());", "        errW.newLine();", "    }", "}"], "links": [{"line": 31, "cobol": "src/ADDMPOL.cbl", "start": 158, "end": 198, "resolved": true}]}, {"path": "src/main/java/com/example/poc/addmotorpolicy/batch/RecordCodec.java", "lines": ["package com.example.poc.addmotorpolicy.batch;", "", "import com.example.poc.addmotorpolicy.domain.MotorEntity;", "import com.example.poc.addmotorpolicy.domain.MotorPolicyRequest;", "import com.example.poc.addmotorpolicy.domain.PolicyEntity;", "import org.springframework.stereotype.Component;", "", "import java.math.BigDecimal;", "import java.math.BigInteger;", "", "/**", " * Fixed-width record codec.", " *", " * <p>Parses {@code requests.dat} input lines and serializes", " * {@link PolicyEntity} / {@link MotorEntity} into the byte-exact format that", " * COBOL ADDMPOL writes to {@code policy.dat} / {@code motor.dat}. See spec §6.", " *", " * <p>Encoding contract:", " * <ul>", " *   <li>numeric PIC 9(n) → zero-padded decimal string, exactly n chars<\/li>", " *   <li>alphanumeric PIC X(n) → right-padded with spaces, exactly n chars<\/li>", " * <\/ul>", " */", "// COBOL: ADDMPOL.cbl:44-95 (FD record layouts: REQUEST-RECORD, POLICY / MOTOR output records)", "@Component", "public class RecordCodec {", "", "    public MotorPolicyRequest parseRequest(String line) {", "        // Pad/truncate the line to 143 chars so off-by-one short lines don't crash —", "        // COBOL would also accept short LINE-SEQUENTIAL records and pad with spaces.", "        String s = line.length() >= 143 ? line.substring(0, 143)", "                : padRight(line, 143);", "        Cursor c = new Cursor(s);", "        return new MotorPolicyRequest(", "                c.takeStr(6),                // request_id", "                c.takeNum(10),               // customer_num", "                c.takeNum(10),               // policy_num", "                c.takeStr(10),               // issue_date", "                c.takeStr(10),               // expiry_date", "                c.takeNum(10),               // broker_id", "                c.takeStr(10),               // brokers_ref", "                c.takeNum(6),                // payment", "                c.takeStr(15),               // make", "                c.takeStr(15),               // model", "                c.takeNum(6),                // value", "                c.takeStr(7),                // regnumber", "                c.takeStr(8), tatic String padRight(String s, int width) {", "        String t = (s == null) ? \"\" : s;", "        if (t.length() >= width) return t.substring(0, width);", "        return t + \" \".repeat(width - t.length());", "    }", "", "    private static final class Cursor {", "        private final String s;", "        private int pos = 0;", "        Cursor(String s) { this.s = s; }", "        String takeStr(int n) {", "            String out = s.substring(pos, pos + n);", "            pos += n;", "            return out;", "        }", "        BigDecimal takeNum(int n) {", "            String raw = s.substring(pos, pos + n);", "            pos += n;", "            String trimmed = raw.trim();", "            if (trimmed.isEmpty()) return BigDecimal.ZERO;", "            return new BigDecimal(new BigInteger(trimmed));", "        }", "    }", "}"], "links": [{"line": 24, "cobol": "src/ADDMPOL.cbl", "start": 44, "end": 95, "resolved": true}]}, {"path": "src/main/java/com/example/poc/addmotorpolicy/domain/MotorEntity.java", "lines": ["package com.example.poc.addmotorpolicy.domain;", "", "import jakarta.persistence.Column;", "import jakarta.persistence.Entity;", "import jakarta.persistence.Id;", "import jakarta.persistence.Table;", "", "import java.math.BigDecimal;", "", "/**", " * Child motor row. Mirrors the DB2-MOTOR group in {@code lgpolicy.cpy} and", " * the {@code MOUT-*} layout in ADDMPOL.cbl FILE SECTION.", " *", " * <p>COBOL: ADDMPOL.cbl:75-86 (MOTOR-OUT-RECORD)", " */", "@Entity", "@Table(name = \"motor\")", "public class MotorEntity {", "", "    @Id", "    @Column(name = \"policynumber\", nullable = false)", "    private BigDecimal policyNumber;        // PIC 9(10)", "", "    @Column(name = \"make\", length = 15)", "    private String make;                    // PIC X(15)", "", "    @Column(name = \"model\", length = 15)", "    private String model;                   // PIC X(15)", "", "    @Column(name = \"value\")", "    private BigDecimal value;               // <script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const nFix = data.stats.fixtures.length;
  const $ = id => document.getElementById(id);

  $('stats').textContent = `${data.stats.cobol_files} COBOL files · ${data.stats.paragraphs} paragraphs · ${data.stats.cited} cited by Java · `
    + (nFix ? `${data.stats.covered} executed by the ${nFix} fixtures · ` : '') + `${data.stats.java_files} Java files · ${data.stats.links} citations`;

  let cobolIdx = 0, javaIdx = 0;
  const cobolByPath = Object.fromEntries(data.cobol.map((f, i) => [f.path, i]));

  function tabs(container, files, active, onPick) {
    container.innerHTML = '';
    files.forEach((f, i) => {
      const b = document.createElement('button');
      b.textContent = f.path.split('/').pop();
      b.title = f.path;
      if (i === active) b.classList.add('active');
      b.onclick = () => onPick(i);
      container.appendChild(b);
    });
  }

  function badge(p) {
    if (nFix && p.covered === 0) return `<span class="badge b-bad">0/${nFix} fixtures</span>`;
    const parts = [];
    if (nFix) parts.push(`<span class="badge b-ok">${p.covered}/${nFix} fixtures</span>`);
    parts.push(p.cited_by.length ? `<span class="badge b-ok">${p.cited_by.length} Java citation${p.cited_by.length > 1 ? 's' : ''}</span>`
                                 : `<span class="badge b-warn">not cited by Java</span>`);
    return parts.join('');
  }

  function renderCobol(i) {
    cobolIdx = i;
    const f = data.cobol[i];
    tabs($('cobolTabs'), data.cobol, i, renderCobol);
    const paraAt = {};
    f.paragraphs.forEach(p => paraAt[p.start] = p);
    const html = f.lines.map((t, k) => {
      const n = k + 1, p = paraAt[n];
      if (p) return `<div class="ln para" id="c-${i}-${n}" data-para="${p.name}"><span class="n">${n}</span><span class="t">${esc(t)}${badge(p)}</span></div>`;
      return `<div class="ln" id="c-${i}-${n}"><span class="n">${n}</span><span class="t">${esc(t)}</span></div>`;
    }).join('');
    $('cobolCode').innerHTML = html;
    $('cobolCode').querySelectorAll('.ln.para').forEach(el => el.onclick = () => showCites(f, el.dataset.para));
  }

  function showCites(f, name) {
    const p = f.paragraphs.find(x => x.name === name);
    if (!p) return;
    const list = p.cited_by.map(c => `<a data-java="${c.java}" data-line="${c.line}">${c.java.split('/').pop()}:${c.line}</a>`).join(' · ');
    $('cobolInfo').innerHTML = `<b>${p.program} ${p.name}</b> (lines ${p.start}-${p.end})` + (nFix ? ` · executed by ${p.covered}/${nFix} fixtures` : '')
      + ` · cited by: ${list || '<span class="b-warn">nothing in the Java</span>'}`;
    $('cobolInfo').querySelectorAll('a').forEach(a => a.onclick = () => jumpJava(a.dataset.java, +a.dataset.line));
    highlight('cobolCode', `c-${cobolIdx}-`, p.start, p.end, 'hl');
  }

  function renderJava(i) {
    javaIdx = i;
    const f = data.java[i];
    tabs($('javaTabs'), data.java, i, renderJava);
    const linksAt = {};
    f.links.forEach(l => (linksAt[l.line] = linksAt[l.line] || []).push(l));
    const html = f.lines.map((t, k) => {
      const n = k + 1;
      let text = esc(t);
      if (linksAt[n]) {
        text = text.replace(/COBOL:[^\n]*?\.(?:cbl|cpy|CBL|COB|CPY)\s*:\s*\d+(?:\s*-\s*\d+)?/g, m => `<span class="cite" data-line="${n}">${m}</span>`);
      }
      return `<div class="ln" id="j-${i}-${n}"><span class="n">${n}</span><span class="t">${text}</span></div>`;
    }).join('');
    $('javaCode').innerHTML = html;
    $('javaCode').querySelectorAll('.cite').forEach(el => el.onclick = () => {
      const ls = linksAt[+el.dataset.line].filter(l => l.resolved);
      if (!ls.length) { $('javaInfo').textContent = 'Citation does not resolve to a file of this module.'; return; }
      const l = ls[0];
      $('javaInfo').innerHTML = `→ <b>${l.cobol}</b> lines ${ls.map(x => x.start + '-' + x.end).join(', ')}`;
      jumpCobol(l.cobol, ls);
    });
  }

  function highlight(codeId, prefix, start, end, cls) {
    const code = $(codeId);
    code.querySelectorAll('.ln.hl, .ln.hl2').forEach(el => el.classList.remove('hl', 'hl2'));
    for (let n = start; n <= end; n++) { const el = document.getElementById(prefix + n); if (el) el.classList.add(cls); }
    const first = document.getElementById(prefix + start);
    if (first) first.scrollIntoView({ block: 'center' });
  }

  function jumpCobol(path, ranges) {
    const i = cobolByPath[path];
    if (i === undefined) return;
    if (i !== cobolIdx) renderCobol(i);
    const code = $('cobolCode');
    code.querySelectorAll('.ln.hl, .ln.hl2').forEach(el => el.classList.remove('hl', 'hl2'));
    ranges.forEach((r, k) => { for (let n = r.start; n <= r.end; n++) { const el = document.getElementById(`c-${i}-${n}`); if (el) el.classList.add(k ? 'hl2' : 'hl'); } });
    const first = document.getElementById(`c-${i}-${ranges[0].start}`);
    if (first) first.scrollIntoView({ block: 'center' });
  }

  function jumpJava(path, line) {
    const i = data.java.findIndex(f => f.path === path);
    if (i < 0) return;
    if (i !== javaIdx) renderJava(i);
    highlight('javaCode', `j-${i}-`, line, line, 'hl');
  }

  // search over both panes: Enter cycles through matches
  let matches = [], mi = -1;
  $('search').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    if (!matches.length || matches.q !== q) {
      matches = [];
      matches.q = q;
      data.cobol.forEach((f, i) => f.lines.forEach((t, k) => { if (t.toLowerCase().includes(q)) matches.push({ side: 'c', i, n: k + 1 }); }));
      data.java.forEach((f, i) => f.lines.forEach((t, k) => { if (t.toLowerCase().includes(q)) matches.push({ side: 'j', i, n: k + 1 }); }));
      mi = -1;
    }
    if (!matches.length) { $('cobolInfo').textContent = `no match for "${q}"`; return; }
    mi = (mi + 1) % matches.length;
    const m = matches[mi];
    if (m.side === 'c') { if (m.i !== cobolIdx) renderCobol(m.i); highlight('cobolCode', `c-${m.i}-`, m.n, m.n, 'hl'); }
    else { if (m.i !== javaIdx) renderJava(m.i); highlight('javaCode', `j-${m.i}-`, m.n, m.n, 'hl'); }
    $('cobolInfo').textContent = `match ${mi + 1} / ${matches.length} for "${q}"`;
  });

  renderCobol(0);
  renderJava(0);
})();
</script>

                  PIC X(16).                      ", "           05 FD-ACCT-DATA                      PIC X(334).                     ", "                                                                                ", "       FD  XREF-FILE.                                                           ", "       01  FD-XREFFILE-REC.                                                     ", "           05 FD-XREF-CARD-NUM                  PIC X(16).                      ", "           05 FD-XREF-DATA                      PIC X(34).                      ", "                                                                                ", "       FD  DALYREJS-FILE.                                                       ", "       01  FD-REJS-RECORD.                                                      ", "           05 FD-REJECT-RECORD                  PIC X(350).                     ", "           05 FD-VALIDATION-TRAILER             PIC X(80).                      ", "                                                                                ", "       FD  ACCOUNT-FILE.                                                        ", "       01  FD-ACCTFILE-REC.                                                     ", "           05 FD-ACCT-ID                        PIC 9(11).                      ", "           05 FD-ACCT-DATA                      PIC X(289).                     ", "                                                                                ", "       FD  TCATBAL-FILE.                                                        ", "       01  FD-TRAN-CAT-BAL-RECORD.                                              ", "           05 FD-TRAN-CAT-KEY.                                                  ", "              10 FD-TRANCAT-ACCT-ID             PIC 9(11).                      ", "              10 FD-TRANCAT-TYPE-CD             PIC X(02).                      ", "              10 FD-TRANCAT-CD                  PIC 9(04).                      ", "           05 FD-FD-TRAN-CAT-DATA               PIC X(33).                      ", "                                                                                ", "       WORKING-STORAGE SECTION.                                                 ", "                                                                                ", "      *****************************************************************         ", "       COPY CVTRA06Y.                                                           ", "       01  DALYTRAN-STATUS.                                                     ", "           05  DALYTRAN-STAT1      PIC X.                                       ", "           05  DALYTRAN-STAT2      PIC X.                                       ", "                                                                                ", "       COPY CVTRA05Y.                                                           ", "       01  TRANFILE-STATUS.                                                     ", "           05  TRANFILE-STAT1      PIC X.                                       ", "           05  TRANFILE-STAT2      PIC X.                                       ", "                                                                                ", "       COPY CVACT03Y.                                                           ", "       01  XREFFILE-STATUS.                                                     ", "           05  XREFFILE-STAT1      PIC X.                                       ", "           05  XREFFILE-STAT2      PIC X.                                       ", "                                                                                ", "       01  DALYREJS-STATUS.                                                     ", "           05  DALYREJS-STAT1      PIC X.                                       ", "           05  DALYREJS-STAT2      PIC X.                                       ", "                                                                                ", "       COPY CVACT01Y.                                                           ", "       01  ACCTFILE-STATUS.                                                     ", "           05  ACCTFILE-STAT1      PIC X.                                       ", "           05  ACCTFILE-STAT2      PIC X.                                       ", "                                                                                ", "       COPY CVTRA01Y.                                                           ", "       01  TCATBALF-STATUS.                                                     ", "           05  TCATBALF-STAT1      PIC X.                                       ", "           05  TCATBALF-STAT2      PIC X.                                       ", "                                                                                ", "       01  IO-STATUS.                                                           ", "           05  IO-STAT1            PIC X.                                       ", "           05  IO-STAT2            PIC X.                                       ", "       01  TWO-BYTES-BINARY        PIC 9(4) BINARY.                             ", "       01  TWO-BYTES-ALPHA         REDEFINES TWO-BYTES-BINARY.                  ", "           05  TWO-BYTES-LEFT      PIC X.                                       ", "           05  TWO-BYTES-RIGHT     PIC X.                                       ", "       01  IO-STATUS-04.                                                        ", "           05  IO-STATUS-0401      PIC 9   VALUE 0.                             ", "           05  IO-STATUS-0403      PIC 999 VALUE 0.                             ", "                                                                                ", "       01  APPL-RESULT             PIC S9(9)   COMP.                            ", "           88  APPL-AOK            VALUE 0.                                     ", "           88  APPL-EOF            VALUE 16.                                    ", "                                                                                ", "       01  END-OF-FILE             PIC X(01)    VALUE 'N'.                      ", "       01  ABCODE                  PIC S9(9) BINARY.                            ", "       01  TIMING                  PIC S9(9) BINARY.                            ", "      * T I M E S T A M P   D B 2  X(26)     EEEE-MM-DD-UU.MM.SS.HH0000         ", "       01  COBOL-TS.                                                            ", "           05 COB-YYYY                  PIC X(04).                              ", "           05 COB-MM                    PIC X(02).                              ", "           05 COB-DD                    PIC X(02).                              ", "           05 COB-HH                    PIC X(02).                              ", "           05 COB-MIN                   PIC X(02).                              ", "           05 COB-SS                    PIC X(02).                              ", "           05 COB-MIL                   PIC X(02).                              ", "           05 COB-REST                  PIC X(05).                              ", "       01  DB2-FORMAT-TS                PIC X(26).                              ", "       01  FILLER REDEFINES DB2-FORMAT-TS.                                      ", "           06 DB2-YYYY                  PIC X(004).                      E      ", "           06 DB2-STREEP-1              PIC X.                           -      ", "           06 DB2-MM                    PIC X(002).                      M      ", "           06 DB2-STREEP-2              PIC X.                           -      ", "           06 DB2-DD                    PIC X(002).                      D      ", "           06 DB2-STREEP-3              PIC X.                           -      ", "           06 DB2-HH                    PIC X(002).                      U      ", "           06 DB2-DOT-1                 PIC X. *************************************         ", "       PROCEDURE DIVISION.                                                      ", "           DISPLAY 'START OF EXECUTION OF PROGRAM CBTRN02C'.                    ", "           PERFORM 0000-DALYTRAN-OPEN.                                          ", "           PERFORM 0100-TRANFILE-OPEN.                                          ", "           PERFORM 0200-XREFFILE-OPEN.                                          ", "           PERFORM 0300-DALYREJS-OPEN.                                          ", "           PERFORM 0400-ACCTFILE-OPEN.                                          ", "           PERFORM 0500-TCATBALF-OPEN.                                          ", "                                                                                ", "           PERFORM UNTIL END-OF-FILE = 'Y'                                      ", "               IF  END-OF-FILE = 'N'                                            ", "                   PERFORM 1000-DALYTRAN-GET-NEXT                               ", "                   IF  END-OF-FILE = 'N'                                        ", "                     ADD 1 TO WS-TRANSACTION-COUNT                              ", "      *              DISPLAY DALYTRAN-RECORD                                    ", "                     MOVE 0 TO WS-VALIDATION-FAIL-REASON                        ", "                     MOVE SPACES TO WS-VALIDATION-FAIL-REASON-DESC              ", "                     PERFORM 1500-VALIDATE-TRAN                                 ", "                     IF WS-VALIDATION-FAIL-REASON = 0                           ", "                       PERFORM 2000-POST-TRANSACTION                            ", "                     ELSE                                                       ", "                       ADD 1 TO WS-REJECT-COUNT                                 ", "                       PERFORM 2500-WRITE-REJECT-REC                            ", "                     END-IF                                                     ", "                   END-IF                                                       ", "               END-IF                                                           ", "           END-PERFORM.                                                         ", "                                                                                ", "           PERFORM 9000-DALYTRAN-CLOSE.                                         ", "           PERFORM 9100-TRANFILE-CLOSE.                                         ", "           PERFORM 9200-XREFFILE-CLOSE.                                         ", "           PERFORM 9300-DALYREJS-CLOSE.                                         ", "           PERFORM 9400-ACCTFILE-CLOSE.                                         ", "           PERFORM 9500-TCATBALF-CLOSE.                                         ", "           DISPLAY 'TRANSACTIONS PROCESSED :' WS-TRANSACTION-COUNT              ", "           DISPLAY 'TRANSACTIONS REJECTED  :' WS-REJECT-COUNT                   ", "           IF WS-REJECT-COUNT > 0                                               ", "              MOVE 4 TO RETURN-CODE                                             ", "           END-IF                                                               ", "           DISPLAY 'END OF EXECUTION OF PROGRAM CBTRN02C'.                      ", "                                                                                ", "           GOBACK.                                                              ", "      *---------------------------------------------------------------*         ", "       0000-DALYTRAN-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN INPUT DALYTRAN-FILE                                             ", "           IF  DALYTRAN-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING DALYTRAN'                                 ", "               MOVE DALYTRAN-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       0100-TRANFILE-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN OUTPUT TRANSACT-FILE                                            ", "           IF  TRANFILE-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING TRANSACTION FILE'                         ", "               MOVE TRANFILE-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "                                                                                ", "      *---------------------------------------------------------------*         ", "       0200-XREFFILE-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN INPUT XREF-FILE                                                 ", "           IF  XREFFILE-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING CROSS REF FILE'                           ", "               MOVE XREFFILE-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       0300-DALYREJS-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN OUTPUT DALYREJS-FILE                                            ", "           IF  DALYREJS-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING DALY REJECTS FILE'                        ", "               MOVE DALYREJS-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       0400-ACCTFILE-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN I-O  ACCOUNT-FILE                                               ", "           IF  ACCTFILE-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING ACCOUNT MASTER FILE'                      ", "               MOVE ACCTFILE-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       0500-TCATBALF-OPEN.                                                      ", "           MOVE 8 TO APPL-RESULT.                                               ", "           OPEN I-O  TCATBAL-FILE                                               ", "           IF  TCATBALF-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR OPENING TRANSACTION BALANCE FILE'                 ", "               MOVE TCATBALF-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       1000-DALYTRAN-GET-NEXT.                                                  ", "           READ DALYTRAN-FILE INTO DALYTRAN-RECORD.                             ", "           IF  DALYTRAN-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "      *        DISPLAY DALYTRAN-RECORD                                          ", "           ELSE                                                                 ", "               IF  DALYTRAN-STATUS = '10'                                       ", "                   MOVE 16 TO APPL-RESULT                                       ", "               ELSE                                                             ", "                   MOVE 12 TO APPL-RESULT                                       ", "               END-IF                                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               IF  APPL-EOF                                                     ", "                   MOVE 'Y' TO END-OF-FILE                                      ", "               ELSE                                                             ", "                   DISPLAY 'ERROR READING DALYTRAN FILE'                        ", "                   MOVE DALYTRAN-STATUS TO IO-STATUS                            ", "                   PERFORM 9910-DISPLAY-IO-STATUS                               ", "                   PERFORM 9999-ABEND-PROGRAM                                   ", "               END-IF                                                           ", "           END-IF                                                               ", "           EXIT.                                                                ", "       1500-VALIDATE-TRAN.                                                      ", "           PERFORM 1500-A-LOOKUP-XREF.                                          ", "           IF WS-VALIDATION-FAIL-REASON = 0                                     ", "              PERFORM 1500-B-LOOKUP-ACCT                                        ", "           ELSE                                                                 ", "              CONTINUE                                                          ", "           END-IF                                                               ", "      * ADD MORE VALIDATIONS HERE                                               ", "           EXIT.                                                                ", "                                                                                ", "       1500-A-LOOKUP-XREF.                                                      ", "      *    DISPLAY 'CARD NUMBER: ' DALYTRAN-CARD-NUM                            ", "           MOVE DALYTRAN-CARD-NUM TO FD-XREF-CARD-NUM                           ", "           READ XREF-FILE INTO CARD-XREF-RECORD                                 ", "              INVALID KEY                                                       ", "                MOVE 100 TO WS-VALIDATION-FAIL-REASON                           ", "                MOVE 'INVALID CARD NUMBER FOUND'                                ", "                  TO WS-VALIDATION-FAIL-REASON-DESC                             ", "              NOT INVALID KEY                                                   ", "      *           DISPLAY 'ACCOUNT RECORD FOUND'                                ", "                  CONTINUE                                                      ", "           END-READ                                                             ", "           EXIT.                                                                ", "       1500-B-LOOKUP-ACCT.                                                      ", "           MOVE XREF-ACCT-ID TO FD-ACCT-ID                                      ", "           READ ACCOUNT-FILE INTO ACCOUNT-RECORD                                ", "              INVALID KEY                                                       ", "                MOVE 101 TO WS-VALIDATION-FAIL-REASON                           ", "                MOVE 'ACCOUNT RECORD NOT FOUND'                                 ", "                  TO WS-VALIDATION-FAIL-REASON-DESC                             ", "              NOT INVALID KEY                                                   ", "      *         DISPLAY 'ACCT-CREDIT-LIMIT:' ACCT-CREDIT-LIMIT                  ", "      *         DISPLAY 'TRAN-AMT         :' DALYTRAN-AMT                       ", "                COMPUTE WS-TEMP-BAL = ACCT-CURR-CYC-CREDIT                      ", "                                    - ACCT-CURR-CYC-DEBIT                       ", "                                    + DALYTRAN-AMT                              ", "                                                                                ", "                IF ACCT-CREDIT-LIMIT >= WS-TEMP-BAL                             ", "                  CONTINUE                                                      ", "                ELSE                                                            ", "                  MOVE 102 TO WS-VALIDATION-FAIL-REASON                         ", "                  MOVE 'OVERLIMIT TRANSACTION'                                  ", "                    TO WS-VALIDATION-FAIL-REASON-DESC                           ", "                END-IF                                                          ", "                IF ACCT-EXPIRAION-DATE >= DALYTRAN-ORIG-TS (1:10)               ", "                  CONTINUE                                                      ", "                ELSE                                                            ", "                  MOVE 103 TO WS-VALIDATION-FAIL-REASON                         ", "                  MOVE 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION'             ", "                    TO WS-VALIDATION-FAIL-REASON-DESC                           ", "                END-IF                                                          ", "           END-READ                                                             ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       2000-POST-TRANSACTION.                                                   ", "           MOVE  DALYTRAN-ID            TO    TRAN-ID                           ", "           MOVE  DALYTRAN-TYPE-CD       TO    TRAN-TYPE-CD                      ", "           MOVE  DALYTRAN-CAT-CD        TO    TRAN-CAT-CD                       ", "           MOVE  DALYTRAN-SOURCE        TO    TRAN-SOURCE                       ", "           MOVE  DALYTRAN-DESC          TO    TRAN-DESC                         ", "           MOVE  DALYTRAN-AMT           TO    TRAN-AMT                          ", "           MOVE  DALYTRAN-MERCHANT-ID   TO    TRAN-MERCHANT-ID                  ", "           MOVE  DALYTRAN-MERCHANT-NAME TO    TRAN-MERCHANT-NAME                ", "           MOVE  DALYTRAN-MERCHANT-CITY TO    TRAN-MERCHANT-CITY                ", "           MOVE  DALYTRAN-MERCHANT-ZIP  TO    TRAN-MERCHANT-ZIP                 ", "           MOVE  DALYTRAN-CARD-NUM      TO    TRAN-CARD-NUM                     ", "           MOVE  DALYTRAN-ORIG-TS       TO    TRAN-ORIG-TS                      ", "           PERFORM Z-GET-DB2-FORMAT-TIMESTAMP                                   ", "           MOVE  DB2-FORMAT-TS          TO    TRAN-PROC-TS                      ", "                                                                                ", "           PERFORM 2700-UPDATE-TCATBAL                                          ", "           PERFORM 2800-UPDATE-ACCOUNT-REC                                      ", "           PERFORM 2900-WRITE-TRANSACTION-FILE                                  ", "                                                                                ", "           EXIT.                                                                ", "                                                                                ", "       2500-WRITE-REJECT-REC.                                                   ", "           MOVE DALYTRAN-RECORD TO REJECT-TRAN-DATA                             ", "           MOVE WS-VALIDATION-TRAILER TO VALIDATION-TRAILER                     ", "      *     DISPLAY '***' REJECT-RECORD                                         ", "           MOVE 8 TO APPL-RESULT                                                ", "           WRITE FD-REJS-RECORD FROM REJECT-RECORD                              ", "           IF DALYREJS-STATUS = '00'                                            ", "               MOVE 0 TO  APPL-RESULT                                           ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR WRITING TO REJECTS FILE'                          ", "               MOVE DALYREJS-STATUS  TO IO-STATUS                               ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "      *---------------------------------------------------------------*         ", "       2700-UPDATE-TCATBAL.                                                     ", "      * Update the balances in transaction balance file.                        ", "           MOVE XREF-ACCT-ID TO FD-TRANCAT-ACCT-ID                              ", "           MOVE DALYTRAN-TYPE-CD TO FD-TRANCAT-TYPE-CD                          ", "           MOVE DALYTRAN-CAT-CD TO FD-TRANCAT-CD                                ", "                                                                                ", "           MOVE 'N' TO WS-CREATE-TRANCAT-REC                                    ", "           READ TCATBAL-FILE INTO TRAN-CAT-BAL-RECORD                           ", "              INVALID KEY                                                       ", "                DISPLAY 'TCATBAL record not found for key : '                   ", "                   FD-TRAN-CAT-KEY '.. Creating.'                               ", "                MOVE 'Y' TO WS-CREATE-TRANCAT-REC                               ", "           END-READ.                                                            ", "                                                                                ", "           IF  TCATBALF-STATUS = '00'  OR '23'                                  ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR READING TRANSACTION BALANCE FILE'                 ", "               MOVE TCATBALF-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF.                                                              ", "                                                                                ", "           IF WS-CREATE-TRANCAT-REC = 'Y'                                       ", "              PERFORM 2700-A-CREATE-TCATBAL-REC                                 ", "           ELSE                                                                 ", "              PERFORM 2700-B-UPDATE-TCATBAL-REC                                 ", "           END-IF                                                               ", "                                                                                ", "           EXIT.                                                   ", "               DISPLAY 'ERROR WRITING TO TRANSACTION FILE'                      ", "               MOVE TRANFILE-STATUS  TO IO-STATUS                               ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END-IF                                                               ", "           EXIT.                                                                ", "                                                                                ", "      *---------------------------------------------------------------*         ", "       9000-DALYTRAN-CLOSE.                                                     ", "           MOVE 8 TO  APPL-RESULT.                                              ", "           CLOSE DALYTRAN-FILE                                                  ", "           IF  DALYTRAN-STATUS = '00'                                           ", "               MOVE 0 TO APPL-RESULT                                            ", "           ELSE                                                                 ", "               MOVE 12 TO APPL-RESULT                                           ", "           END-IF                                                               ", "           IF  APPL-AOK                                                         ", "               CONTINUE                                                         ", "           ELSE                                                                 ", "               DISPLAY 'ERROR CLOSING DALYTRAN FILE'                            ", "               MOVE DALYTRAN-STATUS TO IO-STATUS                                ", "               PERFORM 9910-DISPLAY-IO-STATUS                                   ", "               PERFORM 9999-ABEND-PROGRAM                                       ", "           END            ", "          05 FD-TRANS-DATA      PIC X(304).                                     ", "          05 FD-TRAN-PROC-TS    PIC X(26).                                      ", "          05 FD-FILLER          PIC X(20).                                      ", "                                                                                ", "       FD  XREF-FILE.                                                           ", "       01  FD-CARDXREF-REC.                                                     ", "           05 FD-XREF-CARD-NUM                  PIC X(16).                      ", "           05 FD-XREF-DATA                      PIC X(34).                      ", "                                                                                ", "       FD  TRANTYPE-FILE.                                                       ", "       01 FD-TRANTYPE-REC.                                                      ", "          05 FD-TRAN-TYPE       PIC X(02).                                      ", "          05 FD-TRAN-DATA       PIC X(58).                                      ", "                                                                                ", "       FD  TRANCATG-FILE.                                                       ", "       01 FD-TRAN-CAT-RECORD.                                                   ", "           05  FD-TRAN-CAT-KEY.                                                 ", "              10  FD-TRAN-TYPE-CD                         PIC X(02).            ", "              10  FD-TRAN-CAT-CD                          PIC 9(04).            ", "           05  FD-TRAN-CAT-DATA                           PIC X(54).            ", "                                                                                ", "       FD  REPORT-FILE.                                                         ", "       01 FD-REPTFILE-REC       PIC X(133).                                     ", " com.example.poc.nightlybatch.batch.JobStateDao;", "import org.springframework.batch.core.Job;", "import org.springframework.batch.core.JobExecution;", "import org.springframework.batch.core.JobParameters;", "import org.springframework.batch.core.JobParametersBuilder;", "import org.springframework.batch.core.launch.JobLauncher;", "import org.springframework.boot.autoconfigure.SpringBootApplication;", "import org.springframework.boot.builder.SpringApplicationBuilder;", "import org.springframework.context.ConfigurableApplicationContext;", "", "import java.nio.file.Path;", "import java.util.HashMap;", "import java.util.Map;", "", "/**", " * Entry point of the nightly-batch job (module 3).", " *", " * <p>Invoked once per <em>run<\/em> by {@code tools/run-job.py --side java}:", " * <pre>", " *   java -jar nightly-batch.jar --manifest=&lt;cobol/nightly-batch/job.json&gt; --workdir=&lt;sandbox&gt;", " *        --fixture=&lt;name&gt; --run=&lt;n&gt; [--last-run=true] [--abend-after=STEP] [--parm.STEP=v] [--env.VAR=v]", " * <\/pre>", " * The manifest is the JCL analogue: the same file drives the COBOL side, so step", " * order, DD→dataset mapping, return-code rules and capture rules cannot drift.", " * The exit code is MAXRC over every step executed in the job instance, exactly", " * like the bash-side driver (ADR-14).", " */", "@SpringBootApplication", "public class NightlyBatchApplication {", "", "    public static void main(String[] args) throws Exception {", "        Map<String, String> opts = parse(args);", "        Path manifestPath = Path.of(require(opts, \"manifest\"));", "        Path workdir = Path.of(require(opts, \"workdir\")).toAbsolutePath();", "        JobManifest manifest = JobManifest.load(manifestPath);", "        JobRun run = JobRun.fromOptions(manifest, workdir, opts);", "", "        ConfigurableApplicationContext ctx = new SpringApplicationBuilder(NightlyBatchApplication.class)", "                .properties(\"spring.datasource.url=jdbc:h2:file:\" + workdir.resolve(\".nightly-batch\") + \";DB_CLOSE_ON_EXIT=TRUE\")", "                .initializers(c -> c.getBeanFactory().registerSingleton(\"jobRun\", run))", "                .run(args);", "", "        int maxRc;", "        try {", "            JobParameters params = new JobParametersBuilder()", "                    .addString(\"job\", manifest.job())", "                    .addString(\"fixture\", run.fixture())", "                    .toJobParameters();", "            JobExecution exec = ctx.getBean(JobLauncher.class).run(ctx.getBean(Job.class), params);", "            if (exec.getStatus().isUnsuccessful() && run.abendAfter() == null) {", "                // a genuine Spring Batch failure (not the injected abend) must never pass silently", "                System.err.println(\"job ended with status \" + exec.getStatus() + \": \" + exec.getAllFailureExceptions());", "            }", "            maxRc = ctx.getBean(JobStateDao.class).maxRc();", "        } finally {", "            ctx.close();", "        }", "        System.exit(maxRc);", "    }", "", "    static Map<String, String> parse(String[] args) {", "        Map<String, String> m = new HashMap<>();", "        for (String a : args) {", "            if (!a.startsWith(\"--\")) continue;", "            int eq = a.indexOf('=');", "            if (eq < 0) m.put(a.substring(2), \"true\");", "            else m.put(a.substring(2, eq), a.substring(eq + 1));", "        }", "        return m;", "    }", "", "    private static String require(Map<String, String> opts, String key) {", "        String v = opts.get(key);", "        if (v == null || v.isBlank()) throw new IllegalArgumentException(\"missing --\" + key + \"=...\");", "        return v;", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/nightlybatch/batch/AbendException.java", "lines": ["package com.example.poc.nightlybatch.batch;", "", "/**", " * The Java equivalent of {@code CALL 'CEE3ABD' USING ABCODE TIMING}: the step", " * stops where it        opts.get(\"abend-after\"), parms, env);", "    }", "", "    /**", "     * GnuCOBOL's {@code COB_CURRENT_DATE} (\"2022/07/18 00:00:00.00\"): the value", "     * {@code FUNCTION CURRENT-DATE} returns, hundredths included (spike d).", "     * Null = the real clock, which would make the golden master non-reproducible.", "     */", "    static LocalDateTime parseCobCurrentDate(String v) {", "        if (v == null) return LocalDateTime.now();", "        String s = v.trim().replace('/', '-');", "        if (s.length() == 19) s = s + \".00\";", "        return LocalDateTime.parse(s, DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss.SS\"));", "    }", "", "    public JobManifest manifest() { return manifest; }", "    public Path workdir() { return workdir; }", "    public String fixture() { return fixture; }", "    public int runNo() { return runNo; }", "    public boolean lastRun() { return lastRun; }", "    public String abendAfter() { return abendAfter; }", "    public LocalDateTime clock() { return clock; }", "    public boolean isFailed() { return failed; }", "    public void markFailed() { failed = true; }", "    public Map<String, String> stepResults() { return stepResults; }", "", "    /** PARM for a step: the fixture's override or the manifest value. */", "    public String parm(JobManifest.Step step) {", "        return parms.getOrDefault(step.name(), step.parm() == null ? \"\" : step.parm());", "    }", "", "    /** Sandbox path of the dataset bound to a DD name of a step (the JCL //DD). */", "    public Path dd(JobManifest.Step step, String ddName) {", "        String ds = step.dd().get(ddName);", "        if (ds == null) throw new IllegalArgumentException(\"step \" + step.name() + \" has no DD \" + ddName);", "        return workdir.resolve(manifest.dataset(ds).path());", "    }", "", "    public JobManifest.Dataset ddDataset(JobManifest.Step step, String ddName) {", "        return manifest.dataset(step.dd().get(ddName));", "    }", "", "    public Path mport java.nio.charset.StandardCharsets;", "import java.nio.file.Files;", "import java.nio.file.Path;", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * {@code ORGANIZATION IS SEQUENTIAL} files: fixed-length records, no line", " * terminators, ISO-8859-1 (every byte is one char, so overpunched signs and", " * FILLER bytes round-trip untouched).", " */", "public final class FixedRecordFile {", "    private FixedRecordFile() {}", "", "    public static List<String> readAll(Path path, int lrecl) throws IOException {", "        byte[] bytes = Files.readAllBytes(path);", "        if (bytes.length % lrecl != 0) {", "            throw new IOException(path + \": size \" + bytes.length + \" is not a multiple of lrecl \" + lrecl);", "        }", "        List<String> out = new ArrayList<>(bytes.length / lrecl);", "        for (int i = 0; i < bytes.length; i += lrecl) {", "            out.add(new String(bytes, i, lrecl, StandardCharsets.ISO_8859_1));", "        }", "        return out;", "    }", "", "    /** {@code OPEN OUTPUT}: creates or truncates the file. */", "    public static Writer openOutput(Path path, int lrecl) throws IOException {", "        return new Writer(new BufferedOutputStream(Files.newOutputStream(path)), lrecl);", "    }", "", "    public static final class Writer implements AutoCloseable {", "        private final OutputStream out;", "        private final int lrecl;", "        private int count;", "", "        Writer(OutputStream out, int lrecl) { this.out = out; this.lrecl = lrecl; }", "", "        public void write(String record) throws IOException {", "            if (record.length() != lrecl) {", "                throw new IllegalArgumentException(\"record length \" + record.length() + \" != lrecl \" + lrecl);", "            }", "            out.write(record.getBytes(StandardCharsets.ISO_8859_1));", "            count++;", "        }", "", "        public int count() { return count; }", "", "        @Override", "        public void close() throws IOException { out.close(); }", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/nightlybatch/io/KsdsTable.java", "lines": ["package com.example.poc.nightlybatch.io;", "", "import com.example.poc.nightlybatch.batch.JobManifest;", "import com.example.poc.nightlybatch.domain.CobolRecord;", "import com.example.poc.nightlybatch.domain.Layout;", "import com.example.poc.nightlybatch.domain.Layouts;", "import org.springframework.dao.DuplicateKeyException;", "import org.springframework.jdbc.core.JdbcTemplate;", "import org.springframework.jdbc.core.RowMapper;", "", "import java.math.BigDecimal;", "import java.sql.ResultSet;", "import java.sql.SQLException;", "import java.util.ArrayList;", "import java.util.List;", "import java.util.Optional;", "import java.util.stream.Collectors;", "", "/**", " * A VSAM KSDS as a relational table (CLAUDE.md mapping: KSDS → table with the", " * record key as primary key; an alternate index → a secondary index).", " *", " * <p>Columns are the copybook fields: alphanumerics and unsigned numerics as", " * {@code VARCHAR} (exact bytes, zero/space padding preserved so {@code ORDER BY}", " * reproduces VSAM key order), signed amounts as {@code DECIMAL(p,s)}. FILLER", " * bytes get their own columns so a record round-trips byte for byte.", " *", " * <p>The COBOL file verbs map to:", " * <ul>", " *   <li>{@code OPEN OUTPUT} → {@link #truncate()} ({@code DELETE} + create)<\/li>", " *   <li>{@code WRITE} → {@code INSERT}; a duplicate primary key is file status 22<\/li>", " *   <li>{@code READ key} → {@code SELECT … WHERE pk = ?}; not found is status 23<\/li>", " *   <li>{@code READ … KEY IS alt} → {@code SELECT … WHERE alt = ? ORDER BY pk} (first row)<\/li>", " *   <li>{@code REWRITE} → {@code UPDATE … WHERE pk = ?}<\/li>", " *   <li>{@code READ NEXT} (sequential access) → {@code SELECT … ORDER BY pk}<\/li>", " * <\/ul>", " * JDBC rather than JPA on purpose (ADR-13): the programs read-modify-rewrite one", " * record at a time and must see every write immediately, with no identity map", " * and no deferred flush between them.", " */", "public final class KsdsTable {", "    private final JdbcTemplate jdbc;", "    private final String table;", "    private final Layout layout;", "    private final List<Layout.Field> keyFields;", "    private final List<List<Layout.Field>> altKeys = new ArrayList<>();", "    private final RowMapper<CobolRecord> mapper;", "", "    public KsdsTable(JdbcTemplate jdbc, String datasetName, JobManifest.Dataset ds) {", "        this(jdbc, datasetName, Layouts.forCopybook(ds.copybook()), ds);", "    }", "", "    public KsdsTable(JdbcTemplate jdbc, String datasetName, Layout layout, JobManifest.Dataset ds) {", "        if (!ds.isKsds()) throw new IllegalArgumentException(datasetName + \" is not a KSDS\");", "        this.jdbc = jdbc;", "        this.table = datasetName.replace('-', '_');", "        this.layout = layout;", "        this.keyFields = layout.fieldsCovering(ds.keyOffset(), ds.keyLength());", "        for (List<Integer> ak : ds.altKeys()) altKeys.add(layout.fieldsCovering(ak.get(0), ak.get(1)));", "        this.mapper = (rs, n) -> fromRow(rs);", "        createIfAbsent();", "    }", "", "    public Layout layout() { return layout; }", "", "    // ---------------------------------------------------------------- DDL", "", "    private void createIfAbsent() {", "        String cols = layout.fields().stream().map(f -> col(f) + \" \" + sqlType(f) + \" NOT NULL\")", "                .collect(Collectors.joining(\", \"));", "        String pk = keyFields.stream().map(KsdsTable::col).collect(Collectors.joining(\", \"));", "        jdbc.execute(\"CREATE TABLE IF NOT EXISTS \" + table + \" (\" + cols + \", PRIMARY KEY (\" + pk + \"))\");", "        for (int i = 0; i < altKeys.size(); i++) {", "            String ix = altKeys.get(i).stream().map(KsdsTable::col).collect(Collectors.joining(\", \"));", "            jdbc.execute(\"CREATE INDEX IF NOT EXISTS \" + table + \"_AIX\" + (i + 1) + \" ON \" + table + \" (\" + ix + \")\");", "        }", "    }", "", "    /** {@code OPEN OUTPUT}: the file is recreated empty. */", "    public void truncate() {", "        jdbc.execute(\"TRUNCATE TABLE \" + table);", "    }", "", "    private static String col(Layout.Field f) { return f.name().replace('-', '_'); }", "", "    private static String sqlType(Layout.Field f) {", "        return switch (f.kind()) {", "            case X, N -> \"VARCHAR(\" + f.length() + \")\";", "            case S -> \"DECIMAL(\" + f.length() + \",\" + f.scale() + \")\";", "        };", "    }", "", "    // ---------------------------------------------------------------- verbs", "", "    /** {@code WRITE}: false = status 22 (duplicate key). */", "    public boolean write(CobolRecord rec) {", "        String names = layout.fields().stream().map(KsdsTable::col).collect(Collectors.joining(\", \"));", "        String marks = layout.fields().stream().map(f -> \"?\").collect(Collectors.joining(\", \"));", "        try {", "            jdbc.update(\"INSERT INTO \" + table + \" (\" + names + \") VALUES (\" + marks + \")\", params(rec, layout.fields()));", "            return true;", "        } catch (DuplicateKeyException e) {", "            return false;", "        }", "    }", "", "    /** {@code READ file} with the record key set: empty = status 23. */", "    public Optional<CobolRecord> read(String key) {", "        return jdbc.query(\"SELECT * FROM \" + table + \" WHERE \" + where(keyFields), mapper, keyParams(keyFields, key))", "                .stream().findFirst();", "    }", "", "    /** {@code READ file KEY IS alternate-key}: first record in that key's sequence. */", "    public Optional<CobolRecord> readByAlternateKey(int altIndex, String key) {", "        List<Layout.Field> ak = altKeys.get(altIndex);", "        String sql = \"SELECT * FROM \" + table + \" WHERE \" + where(ak) + \" ORDER BY \" + orderBy(keyFields);", "        return jdbc.query(sql, mapper, keyParams(ak, key)).stream().findFirst();", "    }", "", "    /** {@code REWRITE}: false = INVALID KEY (no such record). */", "    public boolean rewrite(CobolRecord rec) {", "        List<Layout.Field> nonKey = layout.fields().stream().filter(f -> !keyFields.contains(f)).toList();", "        String sets = nonKey.stream().map(f -> col(f) + \" = ?\").collect(Collectors.joining(\", \"));", "        Object[] setParams = params(rec, nonKey);", "        Object[] keyParams = params(rec, keyFields);", "        Object[] all = new Object[setParams.length + keyParams.length];", "        System.arraycopy(setParams, 0, all, 0, setParams.length);", "        System.arraycopy(keyParams, 0, all, setParams.length, keyParams.length);", "        return jdbc.update(\"UPDATE \" + table + \" SET \" + sets + \" WHERE \" + where(keyFields), all) == 1;", "    }", "", "    /** Sequential access ({@code READ NEXT} until status 10): every record in key order. */", "    public List<CobolRecord> readAllInKeyOrder() {", "        return jdbc.query(\"SELECT * FROM \" + table + \" ORDER BY \" + orderBy(keyFields), mapper);", "    }", "", "    public int count() {", "        Integer n = jdbc.queryForObject(\"SELECT COUNT(*) FROM \" + table, Integer.class);", "        return n == null ? 0 : n;", "    }", "", "    // ---------------------------------------------------------------- mapping", "", "    private static String where(List<Layout.Field> fields) {", "        return fields.stream().map(f -> col(f) + \" = ?\").collect(Collectors.joining(\" AND \"));", "    }", "", "    private static String orderBy(List<Layout.Field> fields) {", "        return fields.stream().map(KsdsTable::col).collect(Collectors.joining(\", \"));", "    }", "", "    /** Split the raw key bytes into the per-field values of the (possibly composite) key. */", "    private static Object[] keyParams(List<Layout.Field> fields, String rawKey) {", "        Object[] out = new Object[fields.size()];", "        int pos = 0;", "        for (int i = 0; i < fields.size(); i++) {", "            Layout.Field f = fields.get(i);", "            String part = rawKey.substring(pos, pos + f.length());", "            out[i] = f.kind() == Layout.Kind.S ? ZonedDecimal.decodeSigned(part, f.scale()) : part;", "            pos += f.length();", "        }", "        return out;", "    }", "", "    private static Object[] params(CobolRecord rec, List<Layout.Field> fields) {", "        Object[] out = new Object[fields.size()];", "        for (int i = 0; i < fields.size(); i++) {", "            Layout.Field f = fields.get(i);", "            out[i] = f.kind() == Layout.Kind.S ? rec.decimal(f.name()) : rec.get(f.name());", "        }", "        return out;", "    }", "", "    private CobolRecord fromRow(ResultSet rs) throws SQLException {", "        CobolRecord rec = CobolRecord.initialized(layout);", "        for (Layout.Field f : layout.fields()) {", "            if (f.kind() == Layout.Kind.S) {", "                BigDecimal v = rs.getBigDecimal(col(f));", "                rec.setDecimal(f.name(), v == null ? BigDecimal.ZERO : v);", "            } else {", "                rec.set(f.name(), rs.getString(col(f)));", "            }", "        }", "        return rec;", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/nightlybatch/io/PicEditor.java", "lines": ["package com.example.poc.nightlybatch.io;", "", "import java.math.BigDecimal;", "import java.math.RoundingMode;", "", "/**", " * Edited numeric pictures of the report (CVTRA07Y.cpy):", " * {@code -ZZZ,ZZZ,ZZZ.ZZ} (detail amount) and {@code +ZZZ,ZZZ,ZZZ.ZZ} (totals).", " * 15 characters: a fixed sign position followed by 14 characters of", " * zero-suppressed digits with commas and a point.", " *", " * <p>Rules taken from the golden master (fixture 03):", " * <ul>", " *   <li>sign position: {@code -} picture prints {@code -} or space; {@code +} picture prints {@code +} or {@code -};<\/li>", " *   <li>leading zeros and the commas inside them are suppressed to spaces;<\/li>", " *   <li>a value of zero prints as 15 spaces — every digit position is Z, so the", " *       whole field including the point and the sign is blanked.<\/li>", " * <\/ul>", " * The source item is {@code S9(9)V99}; MOVE into the edited field truncates to 2 decimals.", " */", "public final class PicEditor {", "    private PicEditor() {}", "", "    /** {@code -ZZZ,ZZZ,ZZZ.ZZ} */", "    public static String minusZzz(BigDecimal v) { return edit(v, '-'); }", "", "    /** {@code +ZZZ,ZZZ,ZZZ.ZZ} */", "    public static String plusZzz(BigDecimal v) { return edit(v, '+'); }", "", "    private static String edit(BigDecimal value, char signPic) {", "        BigDecimal t = ZonedDecimal.truncate(value, 11, 2);", "        if (t.signum() == 0) return \" \".repeat(15);", "        BigDecimal abs = t.abs().setScale(2, RoundingMode.DOWN);", "        long integerPart = abs.toBigInteger().longValueExact();", "        String decimals = abs.remainder(BigDecimal.ONE).movePointRight(2).setScale(0, RoundingMode.DOWN).toPlainString();", "        decimals = (\"00\" + decimals).substring(decimals.length());", "        String intText = integerPart == 0 ? \"\" : String.format(\"%,d\", integerPart);", "        String body = \" \".repeat(11 - intText.length()) + intText + \".\" + decimals;   // 14 chars", "        char sign = switch (signPic) {", "            case '-' -> t.signum() < 0 ? '-' : ' ';", "            case '+' -> t.signum() < 0 ? '-' : '+';", "            default -> throw new IllegalArgumentException(\"sign picture \" + signPic);", "        };", "        return sign + body;", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/nightlybatch/io/StepIo.java", "lines": ["package com.example.poc.nightlybatch.io;", "", "import java.io.BufferedOutputStream;", "import java.io.IOException;", "import java.io.OutputStream;", "import java.nio.charset.StandardCharsets;", "import java.nio.file.Files;", "import java.nio.file.Path;", "", "/**", " * The step's SYSOUT: what the COBOL program's {@code DISPLAY} statements write.", " * ISO-8859-1 so raw record displays (overpunch characters included) are the", " * same bytes as GnuCOBOL's.", " */", "public final class StepIo implements AutoCloseable {", "    private final OutputStream out;", "    private final OutputStream trace;   // null when the manifest does not enable tracing", "", "    private StepIo(OutputStream out, OutputStream trace) { this.out = out; this.trace = trace; }", "", "    public static StepIo open(Path file) throws IOException {", "        return new StepIo(new BufferedOutputStream(Files.newOutputStream(file)), null);", "    }", "", "    /** stdout plus the paragraph trace ({@code <nn>-<NAME>.trace.txt}, same canonical form as the", "     *  normalised GnuCOBOL {@code -ftrace} output: {@code PROGRAM Paragraph NAME}). */", "    public static StepIo open(Path file, Path traceFile) throws IOException {", "        return new StepIo(new BufferedOutputStream(Files.newOutputStream(file)),", "                traceFile == null ? null : new BufferedOutputStream(Files.newOutputStream(traceFile)));", "    }", "", "    /** Program entry ({@code PROGRAM Entry PROGRAM}): the COBOL program starts. */", "    public void entry(String program) { traceLine(program + \" Entry \" + program); }", "", "    /** Paragraph entry ({@code PROGRAM Paragraph NAME}): control enters a paragraph, by PERFORM or fall-through. */", "    public void paragraph(String program, String name) { traceLine(program + \" Paragraph \" + name); }", "", "    private void traceLine(String line) {", "        if (trace == null) return;", "        try {", "            trace.write(line.getBytes(StandardCharsets.ISO_8859_1));", "            trace.write('\\n');", "        } catch (IOException e) {", "            throw new java.io.UncheckedIOException(e);", "        }", "    }", "", "    /** {@code DISPLAY a b c}: operands concatenated without separators, then a newline. */", "    public void display  new IllegalArgumentException(\"bad overpunch sign in \" + raw);", "        BigInteger unscaled = new BigInteger(digitsOrZero(raw.substring(0, n - 1)) + digit);", "        BigDecimal v = new BigDecimal(unscaled, scale);", "        return negative ? v.negate() : v;", "    }", "", "    public static BigDecimal decodeUnsigned(String raw, int scale) {", "        return new BigDecimal(new BigInteger(digitsOrZero(raw)), scale);", "    }", "", "    public static String encodeSigned(BigDecimal value, int digits, int scale) {", "        BigDecimal t = truncate(value, digits, scale);", "        String d = unscaledDigits(t, digits);", "        int last = d.charAt(digits - 1) - '0';", "        char sign = t.signum() < 0 ? NEG.charAt(last) : POS.charAt(last);", "        return d.substring(0, digits - 1) + sign;", "    }", "", "    public static String encodeUnsigned(BigDecimal value, int digits, int scale) {", "        return unscaledDigits(truncate(value, digits, scale), digits);", "    }", "", "    /** COBOL store semantics: scale truncation toward zero, then low-order digit retention. */", "    public static BigDecimal truncate(BigDecimal value, int digits, int scale) {", "        BigDecimal scaled = value.setScale(scale, RoundingMode.DOWN);", "        BigInteger modulus = BigInteger.TEN.pow(digits);", "        BigInteger kept = scaled.unscaledValue().abs().mod(modulus);", "        BigDecimal result = new BigDecimal(kept, scale);", "        return scaled.signum() < 0 ? result.negate() : result;", "    }", "", "    private static String unscaledDigits(BigDecimal truncated, int digits) {", "        String s = truncated.unscaledValue().abs().toString();", "        return \"0\".repeat(Math.max(0, digits - s.length())) + s;", "    }", "", "    private static String digitsOrZero(String s) {", "        String t = s.replace(' ', '0');", "        return t.isEmpty() ? \"0\" : t;", "    }", "}"], "links": []}, {"path": "src/main/java/com/example/poc/nightlybatch/service/CobolTimestamp.java", "lines": ["package com.example.poc.nightlybatch.service;", "", "import java.time.LocalDateTime;", "import java.time.format.DateTimeFormatter;", "", "/**", " * {@code Z-GET-DB2-FORMAT-TIMESTAMP}: {@code FUNCTION CURRENT-DATE}", " * ({@code YYYYMMDDhhmmsshh…}) rearranged into the DB2 timestamp shape", " * {@code YYYY-MM-DD-hh.mm.ss.hh0000}. The hundredths come from the clock; the", " * last four digits are the literal {@code '0000'}.", " */", "public final class CobolTimestamp {", "    private static final DateTimeFormatter DB2 = DateTimeFormatter.ofPattern(\"yyyy-MM-dd-HH.mm.ss.SS\");", "", "    private CobolTimestamp() {}", "", "    // COBOL: CBTRN02C.cbl:692-706, CBACT04C.cbl:613-627", "    public static String db2Format(LocalDateTime now) {", "        return now.format(DB2) + \"0000\";", "    }", "}"], "links": [{"line": 17, "cobol": "src/CBTRN02C.cbl", "start": 692, "end": 706, "resolved": true}, {"line": 17, "cobol": "src/CBACT04C.cbl", "start": 613, "end": 627, "resolved": true}]}, {"path": "src/main/java/com/example/poc/nightlybatch/service/InterestCalculator.java", "lines": ["package com.example.poc.nightlybatch.service;", "", "import com.example.poc.nightlybatch.domain.CobolRecord;", "import com.example.poc.nightlybatch.io.KsdsTable;", "import com.example.poc.nightlybatch.io.StepIo;", "", "import java.math.BigDecimal;", "import java.math.RoundingMode;", "import java.util.Optional;", "", "/**", " * The business paragraphs of CBACT04C: rate lookup with DEFAULT fallback,", " * monthly interest, the interest transaction and the account update.", " */", "public final class InterestCalculator {", "    private static final BigDecimal TWELVE_HUNDRED = BigDecimal.valueOf(1200);", "", "    /** Thrown where CBACT04C abends after its own error displays. */", "    public static final class LookupFailed extends RuntimeException {", "        LookupFailed() { super(\"abend\"); }", "    }", "", "    private final KsdsTable discgrp;", "    private final KsdsTable accounts;", "    private final StepIo io;", "", "    public InterestCalculator(KsdsTable discgrp, KsdsTable accounts, StepIo io) {", "        this.discgrp = discgrp;", "        this.accounts = accounts;", "        this.io = io;", "    }", "", "    /**", "     * {@code 1200-GET-INTEREST-RATE} + {@code 1200-A-GET-DEFAULT-INT-RATE}: read the", "     * disclosure-group row for (group, type, category); on status 23 retry with group", "     * {@code DEFAULT}; if that is missing too, the program abends. The record read", "     * lands in the working-storage DIS-GROUP-RECORD.", "     */", "    // COBOL: CBACT04C.cbl:415-461", "    public void lookupRate(String groupId, String typeCd, String catCd, CobolRecord discgrpWs) {", "        io.paragraph(\"CBACT04C\", \"1200-GET-INTEREST-RATE\");", "        Optional<CobolRecord> row = discgrp.read(groupId + typeCd + catCd);", "        if (row.isPresent()) {", "            discgrpWs.moveFrom(row.get());", "            return;", "        }", "        io.display(\"DISCLOSURE GROUP RECORD MISSING\");", "        io.display(\"TRY WITH DEFAULT GROUP CODE\");", "        io.paragraph(\"CBACT04C\", \"1200-A-GET-DEFAULT-INT-RATE\");", "        Optional<CobolRecord> dflt = discgrp.read(padRight(\"DEFAULT\", 10) + typeCd + catCd);", "        if (dflt.isPresent()) {", "            discgrpWs.moveFrom(dflt.get());", "            return;", "        }", "        io.display(\"ERROR READING DEFAULT DISCLOSURE GROUP\");", "        throw new LookupFailed();", "    }", "", "    /**", "     * {@code COMPUTE WS-MONTHLY-INT = (TRAN-CAT-BAL * DIS-INT-RATE) / 1200} — no ROUNDED,", "     * so the quotient is truncated toward zero at 2 decimals (ADR-11): 0.09575 → 0.09,", "     * −11.4875 → −11.48.", "     */", "    // COBOL: CBACT04C.cbl:462-467", "    public static BigDecimal monthlyInterest(BigDecimal categoryBalance, BigDecimal annualRatePercent) {", "        return categoryBalance.multiply(annualRatePercent).divide(TWELVE_HUNDRED, 2, RoundingMode.DOWN);", "    }", "", "    /**", "     * {@code 1300-B-WRITE-TX}: fill the working-storage TRAN-RECORD for the interest", "     * transaction. The description is a STRING of 24 characters; the rest of the", "     * 100-byte field is whatever it already held (spaces).", "     */", "    // COBOL: CBACT04C.cbl:473-498", "    public static void fillInterestTransaction(CobolRecord tran, String parmDate, long suffix, CobolRecord accountWs,", "                                               CobolRecord xrefWs, BigDecimal monthlyInterest, String db2Timestamp) {", "        tran.set(\"TRAN-ID\", parmDate + String.format(\"%06d\", suffix));            // STRING PARM-DATE, WS-TRANID-SUFFIX", "        tran.set(\"TRAN-TYPE-CD\", \"01\");", "        tran.setDecimal(\"TRAN-CAT-CD\", new BigDecimal(\"05\"));                      // MOVE '05' TO TRAN-CAT-CD 9(4) → 0005", "        tran.set(\"TRAN-SOURCE\", \"System\");", "        tran.set(\"TRAN-DESC\", \"Int. for a/c \" + accountWs.get(\"ACCT-ID\"));         // STRING 'Int. for a/c ', ACCT-ID", "        tran.setDecimal(\"TRAN-AMT\", monthlyInterest);", "        tran.setDecimal(\"TRAN-MERCHANT-ID\", BigDecimal.ZERO);", "        tran.set(\"TRAN-MERCHANT-NAME\", \"\");", "        tran.set(\"TRAN-MERCHANT-CITY\", \"\");", "        tran.set(\"TRAN-MERCHANT-ZIP\", \"\");", "        tran.set(\"TRAN-CARD-NUM\", xrefWs.get(\"XREF-CARD-NUM\"));", "        tran.set(\"TRAN-ORIG-TS\", db2Timestamp);", "        tran.set(\"TRAN-PROC-TS\", db2Timestamp);", "    }", "", "    /** {@code 1050-UPDATE-ACCOUNT}: add the account's accumulated interest, reset the cycle totals, REWRITE. */", "    // COBOL: CBACT04C.cbl:350-371", "    public void updateAccount(CobolRecord accountWs, BigDecimal totalInterest) {", "        io.paragraph(\"CBACT04C\", \"1050-UPDATE-ACCOUNT\");", "        accountWs.add(\"ACCT-CURR-BAL\", totalInterest);", "        accountWs.setDecimal(\"ACCT-CURR-CYC-CREDIT\", BigDecimal.ZERO);", "        accountWs.setDecimal(\"ACCT-CURR-CYC-DEBIT\", BigDecimal.ZE FixedRecordFile.Writer out;", "    private final StepIo io;", "    private long lineCounter;                                              // WS-LINE-COUNTER 9(09) COMP-3", "    private BigDecimal pageTotal = BigDecimal.ZERO;                        // WS-PAGE-TOTAL S9(09)V99", "    private BigDecimal accountTotal = BigDecimal.ZERO;                     // WS-ACCOUNT-TOTAL S9(09)V99", "    private BigDecimal grandTotal = BigDecimal.ZERO;                       // WS-GRAND-TOTAL S9(09)V99", "    private boolean firstTime = true;                                      // WS-FIRST-TIME", "    private String reptStartDate = pad(\"\", 10);                            // REPT-START-DATE", "    private String reptEndDate = pad(\"\", 10);                              // REPT-END-DATE", "", "    public ReportWriter(FixedRecordFile.Writer out, StepIo io) {", "        this.out = out;", "        this.io = io;", "    }", "", "    public BigDecimal pageTotal() { return pageTotal; }", "", "    /** The EOF branch of the main loop: {@code ADD TRAN-AMT TO WS-PAGE-TOTAL WS-ACCOUNT-TOTAL} with the stale record. */", "    // COBOL: CBTRN03C.cbl:200-202 (faithful defect D2, CLAUDE.md rule 5)", "    public void addStaleAmount(BigDecimal amount) {", "        pageTotal = add(pageTotal, amount);", "        accountTotal = add(accountTotal, amount);", "    }", "", "    /** {@code 1100-WRITE-TRANSACTION-REPORT}. */", "    // COBOL: CBTRN03C.cbl:274-292", "    public void writeTransactionReport(CobolRecord tran, CobolRecord xrefWs, CobolRecord trantypeWs, CobolRecord trancatgWs,", "                                       String startDate, String endDate) throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1100-WRITE-TRANSACTION-REPORT\");", "        if (firstTime) {", "            firstTime = false;", "            reptStartDate = startDate;", "            reptEndDate = endDate;", "            writeHeaders();", "        }", "        if (lineCounter % PAGE_SIZE == 0) {                                // FUNCTION MOD(WS-LINE-COUNTER, WS-PAGE-SIZE) = 0", "            writePageTotals();", "            writeHeaders();", "        }", "        BigDecimal amt = tran.decimal(\"TRAN-AMT\");", "        pageTotal = add(pageTotal, amt);", "        accountTotal = add(accountTotal, amt);", "        writeDetail(tran, xrefWs, trantypeWs, trancatgWs);", "    }", "", "    /** {@code 1110-WRITE-PAGE-TOTALS}. */", "    // COBOL: CBTRN03C.cbl:293-305", "    public void writePageTotals() throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1110-WRITE-PAGE-TOTALS\");", "        writeLine(pad(\"Page Total\", 11) + \".\".repeat(86) + PicEditor.plusZzz(pageTotal));   // REPORT-PAGE-TOTALS", "        grandTotal = add(grandTotal, pageTotal);", "        pageTotal = BigDecimal.ZERO;", "        lineCounter++;", "        writeLine(HEADER_2);", "        lineCounter++;", "    }", "", "    /** {@code 1120-WRITE-ACCOUNT-TOTALS}. */", "    // COBOL: CBTRN03C.cbl:306-317", "    public void writeAccountTotals() throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1120-WRITE-ACCOUNT-TOTALS\");", "        writeLine(pad(\"Account Total\", 13) + \".\".repeat(84) + PicEditor.plusZzz(accountTotal));   // REPORT-ACCOUNT-TOTALS", "        accountTotal = BigDecimal.ZERO;", "        lineCounter++;", "        writeLine(HEADER_2);", "        lineCounter++;", "    }", "", "    /** {@code 1110-WRITE-GRAND-TOTALS}. */", "    // COBOL: CBTRN03C.cbl:318-323", "    public void writeGrandTotals() throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1110-WRITE-GRAND-TOTALS\");", "        writeLine(pad(\"Grand Total\", 11) + \".\".repeat(86) + PicEditor.plusZzz(grandTotal));     // REPORT-GRAND-TOTALS", "    }", "", "    /** {@code 1120-WRITE-HEADERS}: name header, blank line, column titles, dashes. */", "    // COBOL: CBTRN03C.cbl:324-342", "    private void writeHeaders() throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1120-WRITE-HEADERS\");", "        writeLine(pad(\"DALYREPT\", 38) + pad(\"Daily Transaction Report\", 41) + pad(\"Date Range: \", 12)", "                + reptStartDate + \" to \" + reptEndDate);                                     // REPORT-NAME-HEADER", "        lineCounter++;", "        writeLine(\"\");                                                                        // WS-BLANK-LINE", "        lineCounter++;", "        writeLine(HEADER_1);                                                                  // TRANSACTION-HEADER-1", "        lineCounter++;", "        writeLine(HEADER_2);                                                                  // TRANSACTION-HEADER-2", "        lineCounter++;", "    }", "", "    /** {@code 1120-WRITE-DETAIL}: INITIALIZE the detail line (FILLER separators keep their VALUEs), then the MOVEs. */", "    // COBOL: CBTRN03C.cbl:361-375, CVTRA07Y.cpy TRANSACTION-DETAIL-REPORT", "    private void writeDetail(CobolRecord tran, CobolRecord xrefWs, CobolRecord trantypeWs, CobolRecord trancatgWs) throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1120-WRITE-DETAIL\");", "        String line = pad(tran.get(\"TRAN-ID\"), 16) + \" \"", "                + pad(xrefWs.get(\"XREF-ACCT-ID\"), 11) + \" \"", "                + pad(tran.get(\"TRAN-TYPE-CD\"), 2) + \"-\"", "                + pad(trantypeWs.get(\"TRAN-TYPE-DESC\"), 15) + \" \"", "                + pad(tran.get(\"TRAN-CAT-CD\"), 4) + \"-\"", "                + pad(trancatgWs.get(\"TRAN-CAT-TYPE-DESC\"), 29) + \" \"", "                + pad(tran.get(\"TRAN-SOURCE\"), 10) + \"    \"", "                + PicEditor.minusZzz(tran.decimal(\"TRAN-AMT\")) + \"  \";", "        writeLine(line);", "        lineCounter++;", "    }", "", "    /** {@code 1111-WRITE-REPORT-REC}: MOVE to the 133-byte FD record, WRITE. */", "    // COBOL: CBTRN03C.cbl:343-360", "    private void writeLine(String text) throws IOException {", "        io.paragraph(\"CBTRN03C\", \"1111-WRITE-REPORT-REC\");", "        out.write(pad(text, LINE));", "    }", "", "    /** S9(09)V99 accumulators: ADD without SIZE ERROR keeps the low-order digits. */", "    private static BigDecimal add(BigDecimal total, BigDecimal amount) {", "        return ZonedDecimal.truncate(total.add(amount), 11, 2);", "    }", "", "    /** {@code MOVE text TO PIC X(width)}: left-justified, space-filled, truncated. */", "    static String pad(String s, int width) {", "        return s.length() >= width ? s.substring(0, width) : s + \" \".repeat(width - s.length());", "    }", "}"], "links": [{"line": 42, "cobol": "src/CBTRN03C.cbl", "start": 200, "end": 202, "resolved": true}, {"line": 49, "cobol": "src/CBTRN03C.cbl", "start": 274, "end": 292, "resolved": true}, {"line": 70, "cobol": "src/CBTRN03C.cbl", "start": 293, "end": 305, "resolved": true}, {"line": 82, "cobol": "src/CBTRN03C.cbl", "start": 306, "end": 317, "resolved": true}, {"line": 93, "cobol": "src/CBTRN03C.cbl", "start": 318, "end": 323, "resolved": true}, {"line": 100, "cobol": "src/CBTRN03C.cbl", "start": 324, "end": 342, "resolved": true}, {"line": 115, "cobol": "src/CBTRN03C.cbl", "start": 361, "end": 375, "resolved": true}, {"line": 131, "cobol": "src/CBTRN03C.cbl", "start": 343, "end": 360, "resolved": true}]}, {"path": "src/main/java/com/example/poc/nightlybatch/service/TransactionPoster.java", "lines": ["package com.example.poc.nightlybatch.service;", "", "import com.example.poc.nightlybatch.domain.CobolRecord;", "import com.example.poc.nightlybatch.domain.Layouts;", "import com.example.poc.nightlybatch.io.KsdsTable;", "import com.example.poc.nightlybatch.io.StepIo;", "", "import java.math.BigDecimal;", "import java.time.LocalDateTime;", "import java.util.Optional;", "", "/**", " * {@code 2000-POST-TRANSACTION} of CBTRN02C and its three updates. Works on the", " * program's working-storage records exactly as the COBOL does: the transaction", " * record is built field by field, the category balance is read into (or", " * initialised in) its working-storage copy, the account copy filled b

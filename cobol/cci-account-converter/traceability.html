     this.service = service;", "    }", "", "    @Override", "    public void run(String... args) throws Exception {", "        Path requestsFile = Path.of(args.length > 0 ? args[0] : \"requests.dat\");", "", "        try (BufferedReader in = Files.newBufferedReader(requestsFile, StandardCharsets.US_ASCII)) {", "            String line;", "            while ((line = in.readLine()) != null) {", "                if (line.isBlank()) continue;", "                Commarea c = parseRequest(line);", "                service.run(c);", "                displayResult(c);", "            }", "        }", "    }", "", "    /**", "     * Mirror of the driver's {@code UNSTRING WS-INPUT-LINE DELIMITED BY ALL", "     * SPACES INTO ...} (BCTITSCV-RUN.cbl:55-63).", "     *", "     * <p>Token order: {@code IND-CONV COD-INTFZ BSC-COD-FAM BSC-COD-PRO", "     * BSC-COD-SPR COD-CTA-CCI}.", "     */", "    // COBOL: BCTITSCV-RUN.cbl:50-63", "    static Commarea parseRequest(String line) {", "        Commarea c = new Commarea(); // initial state == MOVE SPACES (every field space-padded)", "        String[] toks = line.trim().split(\"\\\\s+\");", "        if (toks.length < 6) {", "            throw new IllegalArgumentException(", "                \"expected 6 whitespace-separated tokens, got \" + toks.length + \" in: \" + line);", "        }", "        c.setIndConv(toks[0]);", "        c.setCodIntfz(toks[1]);", "        c.setBscCodFam(toks[2]);", "        c.setBscCodPro(toks[3]);", "        c.setBscCodSpr(toks[4]);", "        c.setCodCtaCci(toks[5]);", "        return c;", "    }", "", "    /**", "     * Mirror of {@code DISPLAY-RESULT} (BCTITSCV-RUN.cbl:66-73).", "     *", "     * <p>Format:", "     * <pre>", "     *   RC: &lt;2 chars&gt;", "     *   MSG: &lt;trimmed, may be empty&gt;", "     *   FAM-RET: &lt;3 chars, space-padded&gt;", "     *   BCP-EDIT: &lt;20 chars&gt;", "     *   CUENTA-ITE: &lt;20 chars&gt;", "     *   ---", "     * <\/pre>", "     *", "     * <p>Fields are emitted at full PIC width (space-padded right). MSG is", "     * the only field that's trimmed — mirrors COBOL {@code FUNCTION TRIM}", "     * in the driver.", "     */", "    // COBOL: BCTITSCV-RUN.cbl:66-73", "    static void displayResult(Commarea c) {", "        // COBOL DISPLAY appends a newline; the literal includes the trailing", "        // space after the colon (verbatim from the COBOL string literal).", "        System.out.println(\"RC: \"         + c.getCodReturn());", "        System.out.println(\"MSG: \"        + c.getMsgReturn().stripTrailing());", "        System.out.println(\"FAM-RET: \"    + c.getBscCodFamRet());", "        System.out.println(\"BCP-EDIT: \"   + c.getBcpEditIm());", "        System.out.println(\"CUENTA-ITE: \" + c.getCuentaIteEdit());", "        System.out.println(\"---\");", "    }", "}"], "links": [{"line": 26, "cobol": "src/BCTITSCV-RUN.cbl", "start": 31, "end": 73, "resolved": true}, {"line": 58, "cobol": "src/BCTITSCV-RUN.cbl", "start": 50, "end": 63, "resolved": true}, {"line": 92, "cobol": "src/BCTITSCV-RUN.cbl", "start": 66, "end": 73, "resolved": true}]}, {"path": "src/main/java/com/example/poc/cciaccountconverter/domain/Commarea.java", "lines": ["package com.example.poc.cciaccountconverter.domain;", "", "/**", " * Mirror of the 200-byte {@code TI-YRCV-PARAMETROS} commarea defined in", " * {@code copybooks/BCTIYRCV.cpy}. Mutable holder because BCTITSCV reads", " * input fields then writes back into overlapping bytes (the", " * {@code BCP-EDIT-IM} / {@code BCP-EDIT-ST} REDEFINES views).", " *", " * <p>All fields are {@code String} — every PIC clause in the copybook is", " * alphanumeric ({@code PIC X}). Numeric arithmetic happens on local", " * {@link java.math.BigDecimal} values inside the calculator services", " * ({@code BigDecimal} mandate per CLAUDE.md hard rule 1).", " *", " * <p>Initial state matches the driver's {@code MOVE SPACES TO", " * TI-YRCV-PARAMETROS}: every field is space-padded to its PIC width.", " */", "public class Commarea {", "", "    // ---- Input fields (driver populates from requests.dat tokens) -----------", "", "    /** PIC X(04) — interface code, pass-through. */", "    private String codIntfz = \"    \";", "", "    /** PIC X(01) — direction: '1' = CCI→BCP, '2' = BCP→CCI. */", "    private String indConv = \" \";", "", "    /** PIC X(03) — account family: 004/007 IMPACS, 005/009 SAVING/CTS. */", "    private String bscCodFam = \"   \";", "", "    /** PIC X(03) — product code, validated numeric. */", "    private String bscCodPro = \"   \";", "", "    /** PIC X(03) — subproduct code, pass-through. */", "    private String bscCodSpr = \"   \";", "", "    /** PIC X(20) — the 20-byte dual-purpose input: CCI string for", "     *  IND-CONV=1, commercial-account layout for IND-CONV=2. */", "    private String codCtaCci = \"                    \";", "", "    // ---- Output fields (BCTITSCV writes) ------------------------------------", "", "    /** PIC X(02) — return code, \"00\" or \"99\". */", "    private String codReturn = \"  \";", "", "    /** PIC X(80) — error message text (verbatim from COBOL). */", "    private String msgReturn = \" \".repeat(80);", "", "    /** PIC X(03) — returned account family ({@code 0600} CCI→BCP only). */", "    private String bscCodFamRet = \"   \";", "", "    /** PIC X(20) — BCP-EDIT-IM view (REDEFINES alias of BCP-EDIT-ST).", "     *  Set unconditionally at {@code 0500-EVALUA-PROCESO} entry to a copy", "     *  of {@link #codCtaCci}; bytes 8-20 may be overwritten by", "     *  {@code 0600-CALCULA-CTA-COMERCIAL}. */", "    private String bcpEditIm = \"                    \";", "", "    /** PIC X(20) — composed output CCI ({@code 1500} BCP→CCI only). */", "    private String cuentaIteEdit = \"                    \";", "", "    // ---- Getters / setters --------------------------------------------------", "", "    public String getCodIntfz()      { return codIntfz; }", "    public String getIndConv()       { return indConv; }", "    public Stri <script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const nFix = data.stats.fixtures.length;
  const $ = id => document.getElementById(id);

  $('stats').textContent = `${data.stats.cobol_files} COBOL files · ${data.stats.paragraphs} paragraphs · ${data.stats.cited} cited by Java · `
    + (nFix ? `${data.stats.covered} executed by the ${nFix} fixtures · ` : '') + `${data.stats.java_files} Java files · ${data.stats.links} citations`;

  let cobolIdx = 0, javaIdx = 0;
  const cobolByPath = Object.fromEntries(data.cobol.map((f, i) => [f.path, i]));

  function tabs(container, files, active, onPick) {
    container.innerHTML = '';
    files.forEach((f, i) => {
      const b = document.createElement('button');
      b.textContent = f.path.split('/').pop();
      b.title = f.path;
      if (i === active) b.classList.add('active');
      b.onclick = () => onPick(i);
      container.appendChild(b);
    });
  }

  function badge(p) {
    if (nFix && p.covered === 0) return `<span class="badge b-bad">0/${nFix} fixtures</span>`;
    const parts = [];
    if (nFix) parts.push(`<span class="badge b-ok">${p.covered}/${nFix} fixtures</span>`);
    parts.push(p.cited_by.length ? `<span class="badge b-ok">${p.cited_by.length} Java citation${p.cited_by.length > 1 ? 's' : ''}</span>`
                                 : `<span class="badge b-warn">not cited by Java</span>`);
    return parts.join('');
  }

  function renderCobol(i) {
    cobolIdx = i;
    const f = data.cobol[i];
    tabs($('cobolTabs'), data.cobol, i, renderCobol);
    const paraAt = {};
    f.paragraphs.forEach(p => paraAt[p.start] = p);
    const html = f.lines.map((t, k) => {
      const n = k + 1, p = paraAt[n];
      if (p) return `<div class="ln para" id="c-${i}-${n}" data-para="${p.name}"><span class="n">${n}</span><span class="t">${esc(t)}${badge(p)}</span></div>`;
      return `<div class="ln" id="c-${i}-${n}"><span class="n">${n}</span><span class="t">${esc(t)}</span></div>`;
    }).join('');
    $('cobolCode').innerHTML = html;
    $('cobolCode').querySelectorAll('.ln.para').forEach(el => el.onclick = () => showCites(f, el.dataset.para));
  }

  function showCites(f, name) {
    const p = f.paragraphs.find(x => x.name === name);
    if (!p) return;
    const list = p.cited_by.map(c => `<a data-java="${c.java}" data-line="${c.line}">${c.java.split('/').pop()}:${c.line}</a>`).join(' · ');
    $('cobolInfo').innerHTML = `<b>${p.program} ${p.name}</b> (lines ${p.start}-${p.end})` + (nFix ? ` · executed by ${p.covered}/${nFix} fixtures` : '')
      + ` · cited by: ${list || '<span class="b-warn">nothing in the Java</span>'}`;
    $('cobolInfo').querySelectorAll('a').forEach(a => a.onclick = () => jumpJava(a.dataset.java, +a.dataset.line));
    highlight('cobolCode', `c-${cobolIdx}-`, p.start, p.end, 'hl');
  }

  function renderJava(i) {
    javaIdx = i;
    const f = data.java[i];
    tabs($('javaTabs'), data.java, i, renderJava);
    const linksAt = {};
    f.links.forEach(l => (linksAt[l.line] = linksAt[l.line] || []).push(l));
    const html = f.lines.map((t, k) => {
      const n = k + 1;
      let text = esc(t);
      if (linksAt[n]) {
        text = text.replace(/COBOL:[^\n]*?\.(?:cbl|cpy|CBL|COB|CPY)\s*:\s*\d+(?:\s*-\s*\d+)?/g, m => `<span class="cite" data-line="${n}">${m}</span>`);
      }
      return `<div class="ln" id="j-${i}-${n}"><span class="n">${n}</span><span class="t">${text}</span></div>`;
    }).join('');
    $('javaCode').innerHTML = html;
    $('javaCode').querySelectorAll('.cite').forEach(el => el.onclick = () => {
      const ls = linksAt[+el.dataset.line].filter(l => l.resolved);
      if (!ls.length) { $('javaInfo').textContent = 'Citation does not resolve to a file of this module.'; return; }
      const l = ls[0];
      $('javaInfo').innerHTML = `→ <b>${l.cobol}</b> lines ${ls.map(x => x.start + '-' + x.end).join(', ')}`;
      jumpCobol(l.cobol, ls);
    });
  }

  function highlight(codeId, prefix, start, end, cls) {
    const code = $(codeId);
    code.querySelectorAll('.ln.hl, .ln.hl2').forEach(el => el.classList.remove('hl', 'hl2'));
    for (let n = start; n <= end; n++) { const el = document.getElementById(prefix + n); if (el) el.classList.add(cls); }
    const first = document.getElementById(prefix + start);
    if (first) first.scrollIntoView({ block: 'center' });
  }

  function jumpCobol(path, ranges) {
    const i = cobolByPath[path];
    if (i === undefined) return;
    if (i !== cobolIdx) renderCobol(i);
    const code = $('cobolCode');
    code.querySelectorAll('.ln.hl, .ln.hl2').forEach(el => el.classList.remove('hl', 'hl2'));
    ranges.forEach((r, k) => { for (let n = r.start; n <= r.end; n++) { const el = document.getElementById(`c-${i}-${n}`); if (el) el.classList.add(k ? 'hl2' : 'hl'); } });
    const first = document.getElementById(`c-${i}-${ranges[0].start}`);
    if (first) first.scrollIntoView({ block: 'center' });
  }

  function jumpJava(path, line) {
    const i = data.java.findIndex(f => f.path === path);
    if (i < 0) return;
    if (i !== javaIdx) renderJava(i);
    highlight('javaCode', `j-${i}-`, line, line, 'hl');
  }

  // search over both panes: Enter cycles through matches
  let matches = [], mi = -1;
  $('search').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    if (!matches.length || matches.q !== q) {
      matches = [];
      matches.q = q;
      data.cobol.forEach((f, i) => f.lines.forEach((t, k) => { if (t.toLowerCase().includes(q)) matches.push({ side: 'c', i, n: k + 1 }); }));
      data.java.forEach((f, i) => f.lines.forEach((t, k) => { if (t.toLowerCase().includes(q)) matches.push({ side: 'j', i, n: k + 1 }); }));
      mi = -1;
    }
    if (!matches.length) { $('cobolInfo').textContent = `no match for "${q}"`; return; }
    mi = (mi + 1) % matches.length;
    const m = matches[mi];
    if (m.side === 'c') { if (m.i !== cobolIdx) renderCobol(m.i); highlight('cobolCode', `c-${m.i}-`, m.n, m.n, 'hl'); }
    else { if (m.i !== javaIdx) renderJava(m.i); highlight('javaCode', `j-${m.i}-`, m.n, m.n, 'hl'); }
    $('cobolInfo').textContent = `match ${mi + 1} / ${matches.length} for "${q}"`;
  });

  renderCobol(0);
  renderJava(0);
})();
</script>
